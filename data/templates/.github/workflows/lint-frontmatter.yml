# Lifecycle Framework — the corpus gate on every pull request.
# One job: STRICT frontmatter validation of every governed .md (no --warn-only), then an INDEX rebuild
# that must produce no diff. It needs only the corpus engine's one dependency, js-yaml, installed outside
# the project so the project's own dependency tree is never installed here.
# Scripts run by repo-relative path (scripts/*.mjs) — they are scaffolded into the repo, not
# plugin-resident (${CLAUDE_PLUGIN_ROOT} does not resolve on a GitHub Actions runner).
# Actions pinned to Node 24-compatible majors: checkout@v5, setup-node@v6.
name: Lint Frontmatter

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/**'
      - '.github/workflows/lint-frontmatter.yml'

jobs:
  corpus:
    name: Frontmatter + INDEX freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install js-yaml only (the range package.json declares), outside the project tree
        run: |
          npm install --prefix "$RUNNER_TEMP/corpus-engine" --no-save --no-audit --no-fund "js-yaml@^4.1.0"
          ln -s "$RUNNER_TEMP/corpus-engine/node_modules" node_modules

      - name: Validate frontmatter (strict)
        run: node scripts/validate-frontmatter.mjs docs .claude

      - name: Verify the INDEX is fresh
        run: |
          node scripts/build-index.mjs
          git diff --exit-code -- docs/INDEX.md docs/index.json
